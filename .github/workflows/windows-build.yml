name: Build Windows candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser_cache
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
          python -m playwright install chromium
      - name: Test synthetic collection workflows
        run: python -m unittest discover -s tests -v
      - name: Build application with browser
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name FenbiCollector --collect-all playwright
          --add-data "browser_cache:browser_cache"
          --add-data "snapshot_dom.js:."
          --add-data "next_control.js:."
          standalone_main.py
      - name: Verify packaged browser and startup
        run: |
          dist/FenbiCollector/FenbiCollector.exe --help
          dist/FenbiCollector/FenbiCollector.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: FenbiCollector-Windows-candidate
          path: dist/FenbiCollector/
          retention-days: 14
          if-no-files-found: error
