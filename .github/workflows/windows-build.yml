name: Build Windows candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser_cache
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
          python -m playwright install chromium
      - name: Test synthetic collection workflows
        shell: python
        run: |
          import os
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, encoding='utf-8', errors='replace')
          print(result.stdout, end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Synthetic collection tests\n\n```text\n' + result.stdout[-50000:] + '\n```\n')
          if result.returncode:
              detail = result.stdout[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Windows synthetic test details::' + detail)
          sys.exit(result.returncode)
      - name: Build application with browser
        shell: python
        run: |
          import subprocess
          import sys
          result = subprocess.run([
              sys.executable, '-m', 'PyInstaller', '--noconfirm', '--clean', '--onedir', '--console',
              '--name', 'FenbiCollector', '--collect-all', 'playwright', '--collect-all', 'tzdata',
              '--add-data', 'browser_cache:browser_cache',
              '--add-data', 'snapshot_dom.js:.', '--add-data', 'next_control.js:.',
              'standalone_main.py'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, encoding='utf-8', errors='replace')
          print(result.stdout, end='')
          if result.returncode:
              detail = result.stdout[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Windows packaging details::' + detail)
          sys.exit(result.returncode)
      - name: Verify packaged browser and startup
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          app = str(Path('dist/FenbiCollector/FenbiCollector.exe').resolve())
          for flag in ['--help', '--smoke-test']:
              result = subprocess.run([app, flag], stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  text=True, encoding='utf-8', errors='replace', timeout=120)
              print(result.stdout, end='')
              if result.returncode:
                  detail = result.stdout[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Packaged application check failed::' + detail)
                  sys.exit(result.returncode)
      - uses: actions/upload-artifact@v4
        with:
          name: FenbiCollector-Windows-candidate
          path: dist/FenbiCollector/
          retention-days: 14
          if-no-files-found: error
