<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知遥集 · R2接入检查</title><style>body{background:#f6f7f5;color:#26312c;font:17px/1.8 system-ui;max-width:620px;margin:10vh auto;padding:24px}button,a{display:inline-block;border:1px solid #ccd4ce;border-radius:12px;padding:10px 20px;background:white;color:inherit;font:inherit}pre{white-space:pre-wrap;background:white;padding:22px;border-radius:16px}small{color:#68746d}</style><h1>R2接入检查</h1><p>检查当前网站的绑定与私有桶读写，不读取完整学习记录。</p><button id="check">开始检查</button> <a href="./">返回知遥集</a><pre id="out">等待检查</pre><small>测试对象会在检查结束后删除。</small><script>
const button=document.getElementById('check'),out=document.getElementById('out');button.onclick=async()=>{button.disabled=true;out.textContent='检查中…';try{async function api(p){const r=await fetch(p,{credentials:'same-origin',cache:'no-store'}),v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v;}const health=await api('/api/account/health');if(health.version!=='2.9.18-r6')throw Error('当前仍是旧部署，请重新上传修正版6');if(health.noteStorage!=='r2')throw Error('请在原Pages项目添加R2绑定：STUDY_NOTES，然后重新部署');await api('/api/account/me');const test=await api('/api/sync/v2/storage-check');out.textContent=test.ok?'检查通过：R2私有存储读写正常。\n返回网站，登录后点击一次“立即同步”；首次整理请保持页面在前台。':'检查未完成';}catch(e){out.textContent='未通过：'+e.message+'\n如提示登录，请先返回网站登录同一个刷题账号。';}finally{button.disabled=false;}};
</script></html>
