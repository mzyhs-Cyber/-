<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知遥集 · 存储专项检测 S2</title><style>body{max-width:720px;margin:0 auto;padding:32px 22px;background:#f6f8fa;color:#27333c;font:16px/1.7 system-ui}main{padding:24px;background:white;border:1px solid #e4e9ee;border-radius:20px}h1{font-size:23px}button,select{font:inherit;min-height:46px;padding:8px 16px;border:1px solid #ccd5df;border-radius:10px;background:#fff;color:#27333c;margin:6px 5px 6px 0}button:disabled{opacity:.45}#start{background:#edf3f8}#status{padding:12px;background:#f2f5f8;border-radius:10px}li{font-size:14px;overflow-wrap:anywhere}small{color:#667582}a{color:#3b617b}</style></head><body><main><h1>存储专项检测 S2</h1><p>检测账号副本为什么无法保存。正式数据库只读；测试使用独立临时库，不登录、不上传、不加载题库。</p><p>在原网站、原 Safari 或桌面入口中打开。先关闭其他知遥集页面，避免后台同步影响结果。</p><button id="load">读取副本目录</button><select id="profile" aria-label="选择账号副本"></select><div><button id="start" disabled>开始检测</button><button id="stop" disabled>停止</button><button id="export" disabled>导出结果</button></div><p id="status" role="status" aria-live="polite">先读取副本目录；读取失败也会自动完成基础存储测试。</p><ol id="output"></ol><small>只导出大小、耗时和错误类型，不包含题面、笔迹、账号标识和密码。单次测试写入上限16 MiB；超过上限会跳过，避免再次压垮页面。发生写入错误后停止后续写入测试。</small><p><a href="./">返回知遥集</a></p></main><script src="storage-check.js?v=storage-s2"></script></body></html>
